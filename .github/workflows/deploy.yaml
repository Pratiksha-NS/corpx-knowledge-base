
name: Deploy CorpX Knowledge Base

on:
  push:
    branches:
      - main
    paths-ignore:
      - .gitignore
      - README.md
      - CONTRIBUTING.md
      - LICENSE
      - LICENSE.txt

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corp-x-knowledge-base-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      URL_CHECKER_TIMEOUT: ${{ vars.URL_CHECKER_TIMEOUT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run linters
        run: npm run lint:all

      - name: Run scripts from script folder
        shell: bash
        run: |
          set -euo pipefail
          TIMEOUT_SECONDS="${URL_CHECKER_TIMEOUT:-10}"

          if [ ! -d script ]; then
            echo "No script folder found."
            exit 0
          fi

          while IFS= read -r script_file; do
            echo "Running ${script_file}"

            if [ "$(basename "${script_file}")" = "url-checker.js" ]; then
              node "${script_file}" -t "${TIMEOUT_SECONDS}" -d src/posts
            else
              node "${script_file}"
            fi
          done < <(find script -type f -name "*.js" | sort)

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Get repository name
        id: repo
        shell: bash
        run: |
          echo "name=$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2-)" >> "${GITHUB_OUTPUT}"

      - name: Build static site
        env:
          PATH_PREFIX: /${{ steps.repo.outputs.name }}/
        run: npm run eleventy:prod

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs:
      - test
      - build

    if: ${{ github.event_name != 'pull_request' }}

    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: site-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Create deployment status issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${DEPLOY_OUTCOME}" = "success" ]; then
            STATUS_TEXT="succeeded"
          else
            STATUS_TEXT="failed"
          fi

          if [ -z "${PAGE_URL}" ]; then
            PAGE_URL="Not available"
          fi

          TODAY="$(date +'%Y-%m-%d')"

          gh issue create \
            --title "${TODAY} - Deployment: ${STATUS_TEXT}" \
            --body "URL: ${PAGE_URL}"

      - name: Fail job if deployment failed
        if: ${{ steps.deployment.outcome != 'success' }}
        run: exit 1
          
